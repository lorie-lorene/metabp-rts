mr_catalog:
- id: MR-LAT-njila-auth-service
  type: Latence
  service: njila-auth-service
  endpoint: '*'
  http_method: '*'
  phi: Appel equivalent de njila-auth-service ; mediane ~ 2.6 ms
  rho: duration_us <= 11299 (P99)
  source: traces-p99
  threshold_us: 11299
- id: MR-ERR-njila-auth-service
  type: Erreur
  service: njila-auth-service
  endpoint: '*'
  http_method: '*'
  phi: Taux d'erreur nominal de njila-auth-service = 0.0%
  rho: taux_erreur <= 0.1 (nominal 0.0 + marge 0.1)
  source: traces-error
  threshold_error_rate: 0.1
  nominal_error_rate: 0.0
- id: MR-CMP-njila-auth-service
  type: Completude
  service: njila-auth-service
  endpoint: '*'
  http_method: '*'
  phi: njila-auth-service produit typiquement >= 1 span(s) par trace
  rho: nb_spans(njila-auth-service) >= 1
  source: traces-completude
  threshold_min_spans: 1
